<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanWeb MAX</title>
<style>
body{width:330px;margin:0;padding:18px;font:14px/1.45 system-ui,sans-serif;background:#111827;color:#f3f4f6}h1{font-size:19px;margin:0 0 4px}.sub{color:#9ca3af;margin-bottom:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #273244}.switch{position:relative;width:48px;height:27px;flex:none}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#4b5563;border-radius:999px;cursor:pointer}.slider:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:white;border-radius:50%;transition:.18s}input:checked+.slider{background:#16a34a}input:checked+.slider:before{transform:translateX(21px)}button{width:100%;border:0;border-radius:9px;padding:10px;margin-top:12px;background:#2563eb;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.55}.status{margin-top:12px;padding:10px;border-radius:9px;background:#1f2937;color:#d1d5db}.tiny{font-size:12px;color:#9ca3af;margin-top:10px}.ok{color:#86efac}.bad{color:#fca5a5}
</style></head><body>
<h1>CleanWeb MAX</h1><div class="sub">Максимальная блокировка для Edge</div>
<div class="row"><span><b>Защита MAX</b><br><small>сеть + косметика + попапы</small></span><label class="switch"><input id="enabled" type="checkbox"><span class="slider"></span></label></div>
<div class="row"><span><b>YouTube SponsorBlock</b><br><small>спонсорские вставки внутри видео</small></span><label class="switch"><input id="sponsor" type="checkbox"><span class="slider"></span></label></div>
<button id="update">Обновить фильтры сейчас</button>
<div id="status" class="status">Загрузка…</div><div class="tiny">После выключения защиты обнови вкладку, если ранее скрытые элементы не появились сразу.</div>
<script src="popup.js"></script></body></html>
